<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Sophie Ren Tutoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    .hero {
      background: linear-gradient(135deg, #eef7ee, #f6fbf6);
      padding: 3rem 0;
    }

    .hero-box {
      background: white;
      padding: 2rem;
      border-radius: 18px;
      max-width: 750px;
      margin: auto;
      box-shadow: 0 12px 25px rgba(0,0,0,0.06);
      text-align: center;
    }

    .contact-section {
      padding: 3rem 0;
    }

    form {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 18px;
      border: 1px solid #d8e6d8;
    }

    .form-row {
      margin-bottom: 1rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #d8e6d8;
    }

    textarea {
      min-height: 120px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;  /* ✅ this is the key line */
      align-items: center;
      gap: 0.75rem;
    }

  </style>
</head>

<body>

<header>
  <div class="container">
    <nav class="nav">
      <div class="logo-text">
        <a href="index.html" style="display:flex; align-items:center; gap:0.75rem;">
          <div class="logo-box">SR</div>
          <div>
            <div class="logo-title">Sophie Ren Tutoring</div>
            <div class="logo-subtitle">Online</div>
          </div>
        </a>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </div>
</header>

<main>

<section class="hero">
  <div class="hero-box">

    <h1>Get in touch</h1>

    <p>
      If you’d like to enquire or have any questions, feel free to reach out — I’m always happy to chat through what might work best.
    </p>

    <div class="hero-buttons" style="margin-top:1.5rem;">
      <a href="mailto:srentutoring@gmail.com" class="btn-primary">Email me</a>
    </div>

  </div>
</section>

<section class="contact-section">

  <form>

    <div class="form-row">
      <label>Name</label>
      <input type="text" required />
    </div>

    <div class="form-row">
      <label>Email</label>
      <input type="email" required />
    </div>

    <div class="form-row">
      <label>Student Year / Course</label>
      <input type="text" />
    </div>

    <div class="form-row">
      <label>Message</label>
      <textarea placeholder="Tell me a bit about what you're looking for..."></textarea>
    </div>

    <button class="btn-primary">Send enquiry</button>

  </form>

</section>

</main>

</body>
</html>
