<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Sophie Ren Tutoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

   <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  
  <link rel="stylesheet" href="styles.css" />

  <style>
    .hero {
      background: linear-gradient(135deg, #eef7ee, #f6fbf6);
      padding: 3rem 0;
    }

    .hero-box {
      background: white;
      padding: 2rem;
      border-radius: 18px;
      max-width: 750px;
      margin: auto;
      box-shadow: 0 12px 25px rgba(0,0,0,0.06);
      text-align: center;
    }

    .contact-section {
      padding: 3rem 0;
    }

    form {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 18px;
      border: 1px solid #d8e6d8;
    }

    .form-row {
      margin-bottom: 1rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #d8e6d8;
    }

    textarea {
      min-height: 120px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;  /* ✅ this is the key line */
      align-items: center;
      gap: 0.75rem;
    }

  </style>
</head>

<body>

<header>
  <div class="container">
    <nav class="nav">
      <div class="logo-text">
        <a href="index.html" style="display:flex; align-items:center; gap:0.75rem;">
          <div class="logo-box">SR</div>
          <div>
            <div class="logo-title">Sophie Ren Tutoring</div>
            <div class="logo-subtitle">Online</div>
          </div>
        </a>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </div>
</header>

<main>

<section class="contact-section">

<form action="https://formsubmit.co/srentutoring@gmail.com" method="POST">

  <!-- Redirect after successful submission -->
  <input type="hidden" name="_next" value="https://scottmmorris.github.io/sophie-tutoring-webpage/thankyou.html">

  <!-- Email subject -->
  <input type="hidden" name="_subject" value="New Tutoring Enquiry">

  <!-- Disable captcha (optional) -->
  <input type="hidden" name="_captcha" value="false">

  <!-- Prevent robots -->
  <input type="text" name="_honey" style="display:none">

  <div class="form-row">
    <label>Name</label>
    <input
      type="text"
      name="Name"
      required>
  </div>

  <div class="form-row">
    <label>Email</label>
    <input
      type="email"
      name="Email"
      required>
  </div>

  <div class="form-row">
    <label>Student Year / Course</label>
    <input
      type="text"
      name="Student Year or Course"
      required>
  </div>

  <div class="form-row">
    <label>Message</label>
    <textarea
      name="Message"
      placeholder="Tell me a bit about what you're looking for..."
      required></textarea>
  </div>

  <button type="submit" class="btn-primary">
    Send enquiry
  </button>

</form>

</section>

</main>

</body>
</html>
